- defaults:
      link:
          relink: true
- clean: ["~"]
- create:
      ~/.config:
          mode: 0755
      ~/.zsh:
          mode: 0755
      ~/.local/bin:
          mode: 0755
- link:
      ~/.zsh:
          glob: true
          path: config/zsh/*
          exclude:
              - config/zsh/zprofile
              - config/zsh/zshrc
      ~/.config/:
          glob: true
          path: config/*
          exclude:
              - config/1password
              - config/clangd
              - config/gitconfig
              - config/opencode
              - config/lftp
              - config/scripts
              - config/tmux
              - config/tldr
              - config/vim
              - config/zsh
      # 1Password owns ~/.config/1Password, so link only the agent config into it
      ~/.config/1Password/ssh/agent.toml:
          path: config/1password/ssh/agent.toml
          create: true
      # Non XDG configs
      ~/Library/Preferences/clangd: config/clangd
      ~/.clang-format: config/clangd/clang-format
      ~/.gitconfig: config/git/gitconfig
      ~/.lftprc: config/lftp/lftprc
      ~/.tmux.conf: config/tmux/tmux.conf
      ~/Library/Application Support/tlrc/config.toml: config/tldr/config.toml
      ~/.vimrc: config/vim/vimrc
      ~/.zprofile: config/zsh/zprofile
      ~/.zshrc: config/zsh/zshrc
      ~/.config/opencode/opencode.jsonc: config/opencode/opencode.jsonc
- shell:
      - ["git submodule update --init --recursive", Initialize Git submodules]
      - |
          for script in ~/code/config/dotfiles/config/scripts/*; do
              if [[ -f "$script" ]]; then
                  script_name="$(basename "$script" .sh)"
                  ln -sf "$script" "$HOME/.local/bin/$script_name"
              fi
          done
