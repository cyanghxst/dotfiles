# ----------------------------------------
# tmux config
# ----------------------------------------

# ----------------------------------------
# General settings
# ----------------------------------------

set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"

setw -g mouse on
setw -g mode-keys vi
set -s escape-time 0
set -g history-limit 9999999
set-option -g status-keys emacs

# ----------------------------------------
# Key bindings
# ----------------------------------------

# Unbind default keys
unbind C-b
unbind '"'
unbind c
unbind %
unbind Up
unbind Down
unbind Left
unbind Right

# Prefix key
set-option -g prefix C-f
bind-key C-f send-prefix

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "Reloading config file..."

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# Drop the final newline a line selection ends with, as Rex's yank does
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | pbcopy"

# Select the previous command's output: Ctrl+Shift+k walks up to older output
# and Ctrl+Shift+j back down to newer output
# (extended-keys lets tmux tell Ctrl+Shift+k apart from Ctrl+k)
set -s extended-keys on
# Based on https://ianthehenry.com/posts/tmux-copy-last-command/
# Prompts are found by their text, the same two kinds as in rex/init.lua:
#   * the local zsh prompt, whose last line has a no-break space as its second
#     character and a path line (and usually a blank line) above it
#     (see zsh/prompt.zsh)
#   * a one-line "user@host:path$ " prompt, the bash default on remote hosts,
#     with an optional "(venv) " in front
# PROMPT_SEARCH is the regex for searches; PROMPT_LINE and LOCAL_LINE test the
# line under the cursor (in a format, a literal # is written ##)
%hidden PROMPT_SEARCH="^(.\u00a0|([(][^)]+[)] )?[[:alnum:]_.-]+@[[:alnum:]_.-]+:.*[\$#]( |\$))"
%hidden PROMPT_LINE="#{m/r:^(.\u00a0|([(][^)]+[)] )?[[:alnum:]_.-]+@[[:alnum:]_.-]+:.*[\$##]( |\$)),#{copy_cursor_line}}"
%hidden LOCAL_LINE="#{m:?\u00a0*,#{copy_cursor_line}}"
# Terminals may report these keys with an uppercase letter, so accept both forms
bind -n C-S-K send-keys -K C-S-k
bind -n C-S-J send-keys -K C-S-j
bind -n C-S-k {
    if -F "#{pane_in_mode}" {
        # Continuing from an earlier press: jump to the prompt that owns that output
        send -X clear-selection
        send -X start-of-line
        send -X start-of-line
        if -F "${PROMPT_LINE}" {} {
            set -w wrap-search off
            send -X search-backward "${PROMPT_SEARCH}"
            set -wu wrap-search
        }
    } {
        copy-mode
    }
    # From a prompt, move to the last line of the output above it
    # (start-of-line twice reaches the real start of a wrapped line)
    send -X start-of-line
    send -X start-of-line
    if -F "${LOCAL_LINE}" {
        # Step over the path line and the blank line above it
        send -X cursor-up
        send -X start-of-line
        send -X start-of-line
        send -X cursor-up
        if -F "#{==:#{copy_cursor_line},}" { send -X cursor-up }
    } {
        if -F "${PROMPT_LINE}" { send -X cursor-up }
    }
    send -X start-of-line
    send -X start-of-line
    if -F "${PROMPT_LINE}" {
        # Landed on another prompt, so that command printed nothing: keep walking up
        # (unless this is the very first line of history)
        if -F "#{||:#{!=:#{copy_cursor_y},0},#{!=:#{scroll_position},#{history_size}}}" {
            send-keys -K C-S-k
        }
    } {
        # Landed on the last line of some output: select whole lines back to
        # the line below its prompt
        send -X end-of-line
        send -X end-of-line
        send -X select-line
        set -w wrap-search off
        send -X search-backward "${PROMPT_SEARCH}"
        set -wu wrap-search
        if -F "${PROMPT_LINE}" {
            # end-of-line twice reaches the real end of a wrapped command line
            send -X end-of-line
            send -X end-of-line
            send -X cursor-down
            send -X start-of-line
            send -X stop-selection
        } {
            # No prompt above (top of history): stay on the oldest output by
            # walking back down to it
            send -X clear-selection
            send-keys -K C-S-j
        }
    }
}

# The same walk in the other direction: select the next command's output below,
# leaving copy mode once there is nothing newer
bind -n C-S-j {
    if -F "#{pane_in_mode}" {
        send -X clear-selection
        # Find the next prompt below (its output is the one wanted), then the
        # prompt after that, which marks where the output ends
        set -w wrap-search off
        send -X search-forward "${PROMPT_SEARCH}"
        set -pF @copy-walk-pos "#{copy_cursor_y}:#{scroll_position}"
        send -X search-forward "${PROMPT_SEARCH}"
        set -wu wrap-search
        if -F "#{==:#{@copy-walk-pos},#{copy_cursor_y}:#{scroll_position}}" {
            # The cursor did not move, so there is no newer output
            send -X cancel
        } {
            # From that prompt, move to the last line of the output above it
            if -F "${LOCAL_LINE}" {
                send -X cursor-up
                send -X start-of-line
                send -X start-of-line
                send -X cursor-up
                if -F "#{==:#{copy_cursor_line},}" { send -X cursor-up }
            } {
                send -X cursor-up
            }
            send -X start-of-line
            send -X start-of-line
            if -F "${PROMPT_LINE}" {
                # That command printed nothing: keep walking down
                send-keys -K C-S-j
            } {
                send -X end-of-line
                send -X end-of-line
                send -X select-line
                set -w wrap-search off
                send -X search-backward "${PROMPT_SEARCH}"
                set -wu wrap-search
                send -X end-of-line
                send -X end-of-line
                send -X cursor-down
                send -X start-of-line
                send -X stop-selection
            }
        }
    }
}

# Window management
bind H swap-window -t -1 \; select-window -t -1    # Swap with previous window
bind L swap-window -t +1 \; select-window -t +1    # Swap with next window
bind T swap-window -t 0 \; select-window -t 0      # Swap with top window
bind c new-window -a -c "#{pane_current_path}"     # Open new window in current directory

# Pane management
bind % split-window -h -c "#{pane_current_path}"   # Horizontal split with same CWD
bind '"' split-window -v -p 25 -c "#{pane_current_path}" # Vertical split with 25% height in same CWD

# Pane navigation
bind -r k select-pane -U # Switch up
bind -r j select-pane -D # Switch down
bind -r h select-pane -L # Switch left
bind -r l select-pane -R # Switch right

# ----------------------------------------
# Appearance
# ----------------------------------------

# Use terminal colors for built-in modes
set -g theme terminal

# Highlight settings
set -g mode-style "fg=black,bg=green"

# Pane borders
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#414868'
# set -g pane-border-lines double

# ----------------------------------------
# Statusbar
# ----------------------------------------

# Statusbar color
set-option -g status-style "bg=default"
set-option -g status-style "fg=#414868"

# Message text
set-option -g message-style "bg=default"
# fill clears the window list from the line while the prompt is open
set-option -g message-style "fg=#c0caf5,fill=terminal"

# Position and indicators
set-option -g status-left ""
set-option -g status-right "#{?window_zoomed_flag,[ZOOMED],}"
setw -g window-status-format "#{pane_current_command}"
setw -g window-status-current-format "#{pane_current_command}"
set-window-option -g window-status-current-style "fg=#c0caf5"

# Add blank line between status bar and prompt
if -F '#{!=:#{status},2}' {
    set -Fg 'status-format[1]' '#{status-format[0]}'
    set -g 'status-format[0]' ''
    set -g status 2
}
# Show the command prompt and messages on the window list line, not the blank one
set -g message-line 1

# ----------------------------------------
# Misc.
# ----------------------------------------

# Index settings
# set -g base-index 1 # Start window index at 1
# setw -g pane-base-index 1 # Start pane index at 1
set-option -g renumber-windows on # Reorder window indexes on delete
